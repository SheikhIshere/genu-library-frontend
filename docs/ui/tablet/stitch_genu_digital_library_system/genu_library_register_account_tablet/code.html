<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genu Library — Register Account (Tablet)</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#16110f',
            surface: {
              DEFAULT: '#211a17',
              hover: '#2a211c',
              active: '#332a24',
            },
            accent: {
              DEFAULT: '#e8693f',
              hover: '#d45a30',
              muted: 'rgba(232, 105, 63, 0.12)',
              glow: 'rgba(232, 105, 63, 0.15)',
            },
            border: {
              DEFAULT: '#3a322d',
              hover: '#4d433d',
              focus: '#e8693f',
            },
            text: {
              primary: '#ece0dc',
              secondary: '#a89c93',
              muted: '#7a706a',
              onAccent: '#16110f',
            },
            status: {
              success: '#4a7c59',
              error: '#c44d4d',
              warning: '#d4a24e',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #16110f;
      color: #ece0dc;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom input focus treatment */
    .input-field {
      background-color: #16110f;
      border: 1px solid #3a322d;
      color: #ece0dc;
      transition: all 0.2s ease;
    }
    .input-field:hover {
      border-color: #4d433d;
    }
    .input-field:focus {
      outline: none;
      border-color: #e8693f;
      box-shadow: 0 0 0 3px rgba(232, 105, 63, 0.15);
    }

    /* Strength segments transitions */
    .strength-bar {
      transition: background-color 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#16110f] text-[#ece0dc] selection:bg-[#e8693f20] selection:text-[#e8693f]">

  <!-- Top Horizontal Navigation (Tablet Breakpoint 641px–1024px) -->
  <header class="sticky top-0 z-50 bg-[#16110f] border-b border-[#3a322d] w-full">
    <div class="max-w-5xl mx-auto flex items-center justify-between h-16 px-6">
      <!-- Brand Logo -->
      <a href="/" class="flex items-center gap-2.5 group focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#e8693f] rounded-lg p-1">
        <svg class="w-7 h-7 text-[#e8693f] transition-transform group-hover:scale-105" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L3 9v11a2 2 0 002 2h14a2 2 0 002-2V9l-9-7zm0 3.84L18 10v9H6v-9l6-4.16zM11 11h2v6h-2v-6z"/>
        </svg>
        <span class="font-serif text-xl font-bold tracking-tight text-[#ece0dc]">Genu Library</span>
      </a>

      <!-- Right Navigation Actions -->
      <nav class="flex items-center gap-6" aria-label="Main Navigation">
        <a href="/" class="text-sm font-medium text-[#a89c93] hover:text-[#ece0dc] transition-colors min-h-[40px] min-w-[40px] flex items-center justify-center focus-visible:ring-2 focus-visible:ring-[#e8693f] rounded-lg">
          Home
        </a>
        <a href="/books" class="text-sm font-medium text-[#a89c93] hover:text-[#ece0dc] transition-colors min-h-[40px] min-w-[40px] flex items-center justify-center focus-visible:ring-2 focus-visible:ring-[#e8693f] rounded-lg">
          Browse
        </a>
        <a href="/register" class="text-sm font-semibold text-[#e8693f] bg-[#e8693f20] border border-[#e8693f]/30 px-3.5 py-2 rounded-lg min-h-[40px] min-w-[40px] flex items-center justify-center transition-colors hover:bg-[#e8693f30]">
          Register
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Tablet Centered Card Container -->
  <main class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md bg-[#211a17] border border-[#3a322d] rounded-xl p-8 hover:border-[#4d433d] transition-colors shadow-[0_4px_24px_rgba(0,0,0,0.3)]">
      
      <!-- Card Heading & Context -->
      <div class="mb-8">
        <div class="flex items-center gap-2 mb-2">
          <span class="text-xs uppercase tracking-widest text-[#a89c93] font-mono">Sanctum Registry</span>
        </div>
        <h1 class="font-serif text-2xl font-bold text-[#ece0dc] tracking-tight mb-2">
          Create Account
        </h1>
        <p class="text-sm text-[#a89c93] leading-relaxed">
          Join the Genu Library collective of scholars &amp; curators.
        </p>
      </div>

      <!-- Registration Form -->
      <form id="registerForm" class="space-y-5" novalidate>
        
        <!-- 1. Username Field with Inline Availability Validation -->
        <div>
          <label for="username" class="block text-sm font-medium text-[#a89c93] mb-2">
            Username <span class="text-[#e8693f]">*</span>
          </label>
          <div class="relative">
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              placeholder="e.g. alistair_archivist"
              class="input-field w-full h-12 px-4 pr-11 rounded-lg text-sm text-[#ece0dc] placeholder-[#7a706a]"
            />
            <!-- Inline Status Check Icon -->
            <div id="usernameStatus" class="absolute right-3 top-1/2 -translate-y-1/2 w-6 h-6 flex items-center justify-center pointer-events-none transition-all duration-200 opacity-0 scale-75">
              <!-- Dynamically populated -->
            </div>
          </div>
          <p id="usernameError" class="text-xs text-[#c44d4d] mt-1.5 hidden flex items-center gap-1">
            <svg class="w-3.5 h-3.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span>Must be at least 3 characters.</span>
          </p>
        </div>

        <!-- 2. Email Field -->
        <div>
          <label for="email" class="block text-sm font-medium text-[#a89c93] mb-2">
            Email <span class="text-[#e8693f]">*</span>
          </label>
          <div class="relative">
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@sanctum.library.org"
              class="input-field w-full h-12 px-4 rounded-lg text-sm text-[#ece0dc] placeholder-[#7a706a]"
            />
          </div>
        </div>

        <!-- 3. Password Field with Show/Hide Toggle & 5-Segment Strength Meter -->
        <div>
          <label for="password" class="block text-sm font-medium text-[#a89c93] mb-2">
            Password <span class="text-[#e8693f]">*</span>
          </label>
          <div class="relative">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              placeholder="Create a strong passphrase"
              class="input-field w-full h-12 px-4 pr-16 rounded-lg text-sm text-[#ece0dc] placeholder-[#7a706a]"
            />
            <button
              id="togglePasswordBtn"
              type="button"
              class="absolute right-1.5 top-1/2 -translate-y-1/2 text-xs font-semibold uppercase tracking-wider text-[#7a706a] hover:text-[#ece0dc] min-h-[40px] min-w-[48px] px-2.5 rounded-md transition-colors flex items-center justify-center focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#e8693f]"
              aria-label="Toggle password visibility"
            >
              Show
            </button>
          </div>

          <!-- Password Strength Meter: 5-Segment Visual Bar -->
          <div id="strengthContainer" class="mt-3 transition-opacity duration-200 opacity-60">
            <div class="flex gap-1.5 mb-1.5" aria-hidden="true">
              <div id="bar-0" class="strength-bar h-1.5 flex-1 rounded-full bg-[#3a322d]"></div>
              <div id="bar-1" class="strength-bar h-1.5 flex-1 rounded-full bg-[#3a322d]"></div>
              <div id="bar-2" class="strength-bar h-1.5 flex-1 rounded-full bg-[#3a322d]"></div>
              <div id="bar-3" class="strength-bar h-1.5 flex-1 rounded-full bg-[#3a322d]"></div>
              <div id="bar-4" class="strength-bar h-1.5 flex-1 rounded-full bg-[#3a322d]"></div>
            </div>
            <div class="flex items-center justify-between text-xs font-mono">
              <span class="text-[#7a706a]">Complexity:</span>
              <span id="strengthLabel" class="font-semibold text-[#7a706a]">Empty</span>
            </div>
          </div>
        </div>

        <!-- 4. Confirm Password Field with Inline Match Validation -->
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-[#a89c93] mb-2">
            Confirm Password <span class="text-[#e8693f]">*</span>
          </label>
          <div class="relative">
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              required
              placeholder="Re-enter your passphrase"
              class="input-field w-full h-12 px-4 pr-11 rounded-lg text-sm text-[#ece0dc] placeholder-[#7a706a]"
            />
            <!-- Inline Match Indicator -->
            <div id="matchStatus" class="absolute right-3 top-1/2 -translate-y-1/2 w-6 h-6 flex items-center justify-center pointer-events-none transition-all duration-200 opacity-0 scale-75">
              <!-- Dynamically populated -->
            </div>
          </div>
        </div>

        <!-- Social Signup Options — Side by Side for Tablet Layout -->
        <div class="pt-2">
          <div class="flex items-center gap-4 mb-3">
            <div class="flex-1 h-px bg-[#3a322d]"></div>
            <span class="text-xs uppercase tracking-widest text-[#7a706a] font-mono">Or Register With</span>
            <div class="flex-1 h-px bg-[#3a322d]"></div>
          </div>
          
          <div class="flex gap-3">
            <!-- Facebook Button -->
            <button
              type="button"
              class="flex-1 h-12 border border-[#3a322d] bg-[#211a17] hover:bg-[#2a211c] hover:border-[#4d433d] active:scale-[0.98] text-[#a89c93] hover:text-[#ece0dc] rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2.5 min-h-[40px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#e8693f]"
            >
              <svg class="w-4 h-4 text-[#ece0dc]" viewBox="0 0 24 24" fill="currentColor">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              <span>Facebook</span>
            </button>

            <!-- Google Button -->
            <button
              type="button"
              class="flex-1 h-12 border border-[#3a322d] bg-[#211a17] hover:bg-[#2a211c] hover:border-[#4d433d] active:scale-[0.98] text-[#a89c93] hover:text-[#ece0dc] rounded-lg text-sm font-medium transition-all flex items-center justify-center gap-2.5 min-h-[40px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#e8693f]"
            >
              <svg class="w-4 h-4 text-[#ece0dc]" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 5c1.6 0 3 .5 4.1 1.5l3.1-3.1C17.3 1.6 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.3 8.9 5 12 5z"/>
                <path d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.8z"/>
                <path d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.3 0-.8.1-1.6.4-2.3L1.6 7.2C.6 9.2 0 11.5 0 14s.6 4.8 1.6 6.8l3.7-2.9z"/>
                <path d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.3-6.7-5.3L1.6 16c1.9 3.8 5.8 7 10.4 7z"/>
              </svg>
              <span>Google</span>
            </button>
          </div>
        </div>

        <!-- Primary Submit Button -->
        <button
          type="submit"
          class="w-full h-12 bg-[#e8693f] hover:bg-[#d45a30] text-[#16110f] font-semibold text-sm rounded-lg transition-all active:scale-[0.98] min-h-[40px] flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(232,105,63,0.12)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-[#211a17] focus-visible:ring-[#e8693f]"
        >
          <span>Create Account</span>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </form>

      <!-- Card Footer Link -->
      <div class="mt-6 pt-5 border-t border-[#3a322d] text-center">
        <p class="text-sm text-[#a89c93]">
          Already have an account? 
          <a href="/login" class="text-[#e8693f] hover:text-[#d45a30] font-medium transition-colors ml-1 focus-visible:outline-none focus-visible:underline">
            Sign In
          </a>
        </p>
      </div>

    </div>
  </main>

  <!-- Interactive JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const usernameInput = document.getElementById('username');
      const usernameStatus = document.getElementById('usernameStatus');
      const usernameError = document.getElementById('usernameError');

      const passwordInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirmPassword');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const matchStatus = document.getElementById('matchStatus');

      const strengthContainer = document.getElementById('strengthContainer');
      const strengthLabel = document.getElementById('strengthLabel');
      const bars = [
        document.getElementById('bar-0'),
        document.getElementById('bar-1'),
        document.getElementById('bar-2'),
        document.getElementById('bar-3'),
        document.getElementById('bar-4')
      ];

      // Password Strength Calculation (0-5 score)
      function calculateStrength(pwd) {
        let score = 0;
        if (!pwd) return { score: 0, label: 'Empty', color: '#7a706a' };
        if (pwd.length >= 8) score++;
        if (pwd.length >= 12) score++;
        if (/[A-Z]/.test(pwd)) score++;
        if (/[0-9]/.test(pwd)) score++;
        if (/[^A-Za-z0-9]/.test(pwd)) score++;

        if (score <= 1) return { score: Math.max(score, 1), label: 'Weak', color: '#c44d4d' };
        if (score <= 3) return { score, label: 'Medium', color: '#d4a24e' };
        return { score, label: 'Strong', color: '#4a7c59' };
      }

      // Update Strength Meter UI
      function updateStrengthMeter(pwd) {
        const result = calculateStrength(pwd);
        if (!pwd) {
          strengthContainer.style.opacity = '0.5';
          strengthLabel.textContent = 'Empty';
          strengthLabel.style.color = '#7a706a';
          bars.forEach(b => b.style.backgroundColor = '#3a322d');
          return;
        }

        strengthContainer.style.opacity = '1';
        strengthLabel.textContent = result.label;
        strengthLabel.style.color = result.color;

        bars.forEach((bar, idx) => {
          if (idx < result.score) {
            bar.style.backgroundColor = result.color;
          } else {
            bar.style.backgroundColor = '#3a322d';
          }
        });
      }

      // Username Validation Check
      usernameInput.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        if (val.length === 0) {
          usernameStatus.style.opacity = '0';
          usernameStatus.style.transform = 'translateY(-50%) scale(0.75)';
          usernameError.classList.add('hidden');
        } else if (val.length < 3) {
          usernameStatus.style.opacity = '1';
          usernameStatus.style.transform = 'translateY(-50%) scale(1)';
          usernameStatus.innerHTML = `<span class="text-[#c44d4d] font-bold text-sm">✗</span>`;
          usernameError.classList.remove('hidden');
        } else {
          usernameStatus.style.opacity = '1';
          usernameStatus.style.transform = 'translateY(-50%) scale(1)';
          usernameStatus.innerHTML = `<span class="text-[#4a7c59] font-bold text-sm">✓</span>`;
          usernameError.classList.add('hidden');
        }
      });

      // Password input listener
      passwordInput.addEventListener('input', (e) => {
        updateStrengthMeter(e.target.value);
        checkPasswordMatch();
      });

      // Confirm password input listener
      confirmInput.addEventListener('input', checkPasswordMatch);

      function checkPasswordMatch() {
        const pwd = passwordInput.value;
        const confirm = confirmInput.value;

        if (confirm.length === 0) {
          matchStatus.style.opacity = '0';
          matchStatus.style.transform = 'translateY(-50%) scale(0.75)';
          return;
        }

        matchStatus.style.opacity = '1';
        matchStatus.style.transform = 'translateY(-50%) scale(1)';

        if (pwd.length > 0 && pwd === confirm) {
          matchStatus.innerHTML = `<span class="text-[#4a7c59] font-bold text-sm">✓</span>`;
        } else {
          matchStatus.innerHTML = `<span class="text-[#c44d4d] font-bold text-sm">✗</span>`;
        }
      }

      // Toggle Show/Hide Password
      let isVisible = false;
      togglePasswordBtn.addEventListener('click', () => {
        isVisible = !isVisible;
        const newType = isVisible ? 'text' : 'password';
        passwordInput.type = newType;
        confirmInput.type = newType;
        togglePasswordBtn.textContent = isVisible ? 'Hide' : 'Show';
      });

      // Form submission prevention
      document.getElementById('registerForm').addEventListener('submit', (e) => {
        e.preventDefault();
      });
    });
  </script>

</body>
</html>
