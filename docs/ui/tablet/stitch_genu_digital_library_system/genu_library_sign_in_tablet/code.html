<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genu Library — Sign In (Tablet)</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#16110f',
            surface: '#211a17',
            'surface-hover': '#2a211c',
            'surface-active': '#332a24',
            accent: '#e8693f',
            'accent-hover': '#d45a30',
            'accent-muted': 'rgba(232, 105, 63, 0.12)',
            border: '#3a322d',
            'border-hover': '#4d433d',
            'text-primary': '#ece0dc',
            'text-secondary': '#a89c93',
            'text-muted': '#7a706a',
            'text-on-accent': '#16110f',
            success: '#4a7c59',
            error: '#c44d4d'
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          boxShadow: {
            'elevation-1': '0 4px 20px rgba(0, 0, 0, 0.25)',
            'elevation-2': '0 4px 24px rgba(0, 0, 0, 0.4)',
            'glow-accent': '0 0 0 3px rgba(232, 105, 63, 0.15)'
          }
        }
      }
    };
  </script>
  <style>
    /* Smooth transitions and custom states */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #16110f;
      color: #ece0dc;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #ece0dc;
      -webkit-box-shadow: 0 0 0px 1000px #16110f inset;
      transition: background-color 5000s ease-in-out 0s;
    }
    .custom-focus-ring:focus-within {
      border-color: #e8693f;
      box-shadow: 0 0 0 3px rgba(232, 105, 63, 0.15);
    }
    @keyframes cardFadeIn {
      0% {
        opacity: 0;
        transform: translateY(16px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-card-enter {
      animation: cardFadeIn 0.4s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }
  </style>
</head>
<body class="bg-canvas min-h-screen flex flex-col selection:bg-accent selection:text-text-on-accent">

  <!-- Top Horizontal Navigation Bar (Tablet Breakpoint 641px–1024px) -->
  <header class="sticky top-0 z-50 bg-canvas border-b border-border h-16 w-full flex-shrink-0">
    <div class="max-w-5xl mx-auto h-full px-6 flex items-center justify-between">
      <!-- Brand / Logo -->
      <a href="/" class="flex items-center gap-2.5 group focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent rounded-lg p-1 -ml-1">
        <div class="w-8 h-8 rounded-lg bg-surface border border-border flex items-center justify-center text-accent group-hover:border-accent group-hover:bg-surface-hover transition-colors">
          <svg class="w-5 h-5 text-accent transition-transform group-hover:scale-105" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
            <path d="M6 6h10"/>
            <path d="M6 10h10"/>
            <path d="M6 14h6"/>
          </svg>
        </div>
        <span class="font-serif text-xl font-bold text-text-primary tracking-tight group-hover:text-accent transition-colors">Genu Library</span>
      </a>

      <!-- Navigation Links -->
      <nav aria-label="Main Navigation" class="flex items-center gap-3 sm:gap-6">
        <a href="/browse" class="h-10 px-4 rounded-lg text-sm font-medium text-text-secondary hover:text-text-primary hover:bg-surface transition-colors min-h-[40px] min-w-[40px] flex items-center justify-center focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent">
          Browse
        </a>
        <a href="/login" class="h-10 px-4 rounded-lg text-sm font-semibold text-accent bg-accent-muted border border-accent/20 min-h-[40px] min-w-[40px] flex items-center justify-center focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent" aria-current="page">
          Login
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Content Viewport -->
  <main class="flex-1 flex items-center justify-center px-6 py-12 w-full">
    <div class="w-full max-w-md animate-card-enter bg-surface border border-border rounded-xl p-8 shadow-elevation-1 hover:border-border-hover transition-colors">
      
      <!-- Header / Codex Welcome -->
      <div class="mb-8">
        <div class="flex items-center gap-2 mb-2">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-accent"></span>
          <span class="text-xs uppercase tracking-widest text-text-secondary font-medium font-mono">Sanctum Portal</span>
        </div>
        <h1 class="font-serif text-2xl font-bold text-text-primary mb-2 leading-tight">
          Welcome Back
        </h1>
        <p class="text-sm text-text-secondary leading-relaxed">
          Sign in to access illuminated manuscripts and folio codices.
        </p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-5" onsubmit="handleFormSubmit(event)" novalidate aria-label="Login">
        
        <!-- Email Field -->
        <div>
          <label for="emailInput" class="block text-sm font-medium text-text-secondary mb-2">
            Email address
          </label>
          <div class="relative">
            <input
              id="emailInput"
              type="email"
              required
              autocomplete="email"
              placeholder="archivist@sanctum.genu.lib"
              class="w-full h-12 px-4 bg-canvas border border-border rounded-lg text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent focus:shadow-glow-accent transition-all hover:border-border-hover"
            />
          </div>
          <p id="emailError" class="hidden text-xs text-error mt-1.5" role="alert"></p>
        </div>

        <!-- Password Field -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="passwordInput" class="block text-sm font-medium text-text-secondary">
              Password
            </label>
            <a href="#forgot" class="text-xs text-accent hover:text-accent-hover transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-accent rounded">
              Forgot cipher?
            </a>
          </div>
          <div class="relative flex items-center">
            <input
              id="passwordInput"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Enter your secret cipher key"
              class="w-full h-12 pl-4 pr-16 bg-canvas border border-border rounded-lg text-sm text-text-primary placeholder:text-text-muted focus:outline-none focus:border-accent focus:shadow-glow-accent transition-all hover:border-border-hover"
            />
            <button
              type="button"
              id="togglePasswordBtn"
              onclick="togglePasswordVisibility()"
              class="absolute right-1 text-xs font-medium text-text-muted hover:text-text-primary transition-colors min-h-[40px] min-w-[48px] px-2 flex items-center justify-center rounded focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-accent"
              aria-label="Toggle password visibility"
            >
              Show
            </button>
          </div>
          <p id="passwordError" class="hidden text-xs text-error mt-1.5" role="alert"></p>
        </div>

        <!-- Social Login: Side by Side on Tablet -->
        <div class="pt-1">
          <div class="flex gap-3">
            <!-- Facebook Button -->
            <button
              type="button"
              onclick="simulateSocialLogin('Facebook')"
              class="flex-1 h-12 border border-border bg-canvas/60 hover:bg-surface-hover hover:border-border-hover active:scale-[0.98] rounded-lg text-sm text-text-secondary hover:text-text-primary transition-all flex items-center justify-center gap-2.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent min-h-[40px] min-w-[40px]"
              aria-label="Sign in with Facebook"
            >
              <svg class="w-4 h-4 text-text-secondary" viewBox="0 0 24 24" fill="currentColor">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              <span>Facebook</span>
            </button>

            <!-- Google Button -->
            <button
              type="button"
              onclick="simulateSocialLogin('Google')"
              class="flex-1 h-12 border border-border bg-canvas/60 hover:bg-surface-hover hover:border-border-hover active:scale-[0.98] rounded-lg text-sm text-text-secondary hover:text-text-primary transition-all flex items-center justify-center gap-2.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent min-h-[40px] min-w-[40px]"
              aria-label="Sign in with Google"
            >
              <svg class="w-4 h-4 text-text-secondary" viewBox="0 0 24 24" fill="currentColor">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              <span>Google</span>
            </button>
          </div>
        </div>

        <!-- Solid Divider -->
        <div class="flex items-center gap-4 py-1">
          <div class="flex-1 h-px bg-border"></div>
          <span class="text-xs font-mono text-text-muted uppercase">or</span>
          <div class="flex-1 h-px bg-border"></div>
        </div>

        <!-- Submit Button -->
        <button
          id="submitButton"
          type="submit"
          class="w-full h-12 bg-accent hover:bg-accent-hover active:scale-[0.98] text-text-on-accent font-semibold rounded-lg transition-all text-sm flex items-center justify-center gap-2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-surface min-h-[40px] min-w-[40px]"
        >
          <span id="submitText">Sign In</span>
          <svg id="submitSpinner" class="hidden animate-spin h-4 w-4 text-text-on-accent" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>

      </form>

      <!-- Card Footer -->
      <div class="mt-8 pt-4 border-t border-border text-center">
        <p class="text-sm text-text-secondary">
          Don't have an account? 
          <a href="/register" class="font-medium text-accent hover:text-accent-hover underline-offset-4 hover:underline transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-accent rounded px-1">
            Sign Up
          </a>
        </p>
      </div>

    </div>
  </main>

  <!-- Notification Toast (for interactions) -->
  <div id="toastNotification" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transform -translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-surface border border-accent text-text-primary px-5 py-3 rounded-lg shadow-elevation-2 flex items-center gap-3 text-sm">
      <span class="w-2 h-2 rounded-full bg-accent animate-pulse"></span>
      <span id="toastMessage">Authenticated. Welcome back to Genu Library.</span>
    </div>
  </div>

  <!-- Client-side logic for interactivity -->
  <script>
    let passwordVisible = false;

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      passwordVisible = !passwordVisible;
      
      passwordInput.type = passwordVisible ? 'text' : 'password';
      toggleBtn.textContent = passwordVisible ? 'Hide' : 'Show';
    }

    function showToast(message) {
      const toast = document.getElementById('toastNotification');
      const toastText = document.getElementById('toastMessage');
      toastText.textContent = message;
      
      toast.classList.remove('-translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      if (navigator.vibrate) {
        navigator.vibrate(20);
      }

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-20', 'opacity-0');
      }, 3000);
    }

    function simulateSocialLogin(provider) {
      showToast(`Connecting to ${provider} authentication cipher...`);
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const submitText = document.getElementById('submitText');
      const submitSpinner = document.getElementById('submitSpinner');
      const submitButton = document.getElementById('submitButton');

      let valid = true;

      // Simple validation
      if (!emailInput.value || !emailInput.value.includes('@')) {
        emailInput.classList.add('border-error');
        valid = false;
      } else {
        emailInput.classList.remove('border-error');
      }

      if (!passwordInput.value || passwordInput.value.length < 4) {
        passwordInput.classList.add('border-error');
        valid = false;
      } else {
        passwordInput.classList.remove('border-error');
      }

      if (!valid) {
        showToast('Please provide a valid email and secret cipher.');
        return;
      }

      // Simulate sign in process
      submitText.textContent = 'Authenticating...';
      submitSpinner.classList.remove('hidden');
      submitButton.disabled = true;

      setTimeout(() => {
        submitText.textContent = 'Sign In';
        submitSpinner.classList.add('hidden');
        submitButton.disabled = false;
        showToast('Authentication confirmed. Welcome to Genu Library!');
      }, 1200);
    }
  </script>
</body>
</html>
